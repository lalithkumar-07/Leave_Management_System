<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Faculty Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Page Background */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6D7BF3, #8F9BEA);
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    /* Login Card */
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 60px 50px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Decorative glow */
    .login-card::before {
      content: "";
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle at center, #8F9BEA 0%, #6D7BF3 80%);
      opacity: 0.2;
      border-radius: 50%;
      z-index: 0;
    }

    .login-card h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #1d3557;
      z-index: 1;
      position: relative;
    }

    /* Inputs */
    .login-card input {
      width: 100%;
      padding: 14px 18px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      background: #f4f6fa;
      font-size: 16px;
      transition: 0.3s;
      z-index: 1;
      position: relative;
    }

    .login-card input:focus {
      outline: none;
      background: #e9eef9;
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(109, 123, 243, 0.3);
    }

    /* Login button */
    .login-card button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6D7BF3, #8F9BEA);
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      z-index: 1;
      position: relative;
    }

    .login-card button:hover {
      background: linear-gradient(135deg, #8F9BEA, #6D7BF3);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    /* Register link */
    .login-card p {
      margin-top: 20px;
      font-size: 15px;
      color: #333;
      z-index: 1;
      position: relative;
    }

    .login-card a {
      color: #6D7BF3;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .login-card a:hover {
      color: #4a5be8;
      text-decoration: underline;
    }

    /* Flash message */
    .flash {
      margin-top: 15px;
      color: #e63946;
      background: rgba(255, 0, 0, 0.05);
      padding: 10px;
      border-radius: 10px;
      font-weight: 500;
      z-index: 1;
      position: relative;
    }

    /* Subtle floating animation */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .login-card {
      animation: float 4s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Welcome Back 👋</h2>
    <form method="post">
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p>Don't have an account? 
      <a href="{{ url_for('register') }}">Register here</a>
    </p>

    {% for m in get_flashed_messages() %}
      <p class="flash">{{ m }}</p>
    {% endfor %}
  </div>

</body>
</html>
